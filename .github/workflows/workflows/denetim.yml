# Aşama 346: OTOMATİK DENETİM (CI)
# GitHub'a her yükleme (main) ve her değişiklik isteğinde GitHub'ın kendi bilgisayarında çalışır:
#   paketleri kurar (Vercel gibi bun ile) → tip denetimi → api/ dosyalarının söz dizimi → birim testleri → derleme.
# Biri kırmızı olursa GitHub'da "Actions" sekmesinde ve commit'in yanında kırmızı çarpı görünür.
# Canlı sisteme (Supabase, Vercel) bağlanmaz; gizli anahtar kullanmaz; yalnız okuma izniyle çalışır.
name: Denetim

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: denetim-${{ github.ref }}
  cancel-in-progress: true

jobs:
  denetim:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Paketleri kur
        run: bun install

      - name: Tip denetimi
        run: npm run lint

      - name: Sunucu dosyaları (api) söz dizimi
        run: for f in api/*.js; do node --check "$f" || exit 1; done

      - name: Tasarım denetimi (punto, katman, köşe, geçiş, düğme boyu)
        run: npm run denetim:tasarim

      - name: Veri konusu denetimi (sayfa yalnız okuduğu veri değişince yeniden çizilir)
        run: npm run denetim:konu

      - name: Birim testleri
        run: npm test

      - name: Derleme
        run: npm run build
