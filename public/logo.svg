<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#312e81"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="bookGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="120" fill="url(#bgGrad)"/>
  
  <!-- Subtle border & inner glow -->
  <rect width="504" height="504" x="4" y="4" rx="116" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="6"/>
  <circle cx="256" cy="180" r="160" fill="url(#glowGrad)"/>

  <!-- Academic Graduation Cap (Mortarboard) with Shadow -->
  <g filter="url(#shadow)">
    <!-- Cap Diamond Top -->
    <path d="M256 100 L430 178 L256 256 L82 178 Z" fill="url(#goldGrad)"/>
    <!-- Cap Rim / Skullcap -->
    <path d="M150 215 L150 285 C150 330 362 330 362 285 L362 215 L256 262 Z" fill="#b45309" opacity="0.95"/>
    <path d="M165 230 C185 305 327 305 347 230 L256 268 Z" fill="url(#goldGrad)"/>
    <!-- Center Button -->
    <ellipse cx="256" cy="178" rx="12" ry="7" fill="#fef08a"/>
    <!-- Golden Tassel hanging down left -->
    <path d="M256 178 Q190 190 148 240 Q138 270 144 310" fill="none" stroke="#fef08a" stroke-width="7" stroke-linecap="round"/>
    <polygon points="136,310 152,310 148,345 140,345" fill="url(#goldGrad)"/>
  </g>

  <!-- Open Knowledge Book below -->
  <g filter="url(#shadow)">
    <!-- Book Base / Binding spine -->
    <path d="M256 340 C280 326 350 320 420 336 L420 422 C350 406 280 412 256 428 C232 412 162 406 92 422 L92 336 C162 320 232 326 256 340 Z" fill="#1e293b"/>
    <!-- Book Left Pages -->
    <path d="M252 336 C226 322 160 318 96 332 L96 414 C160 400 226 404 252 420 Z" fill="url(#bookGrad)"/>
    <!-- Book Right Pages -->
    <path d="M260 336 C286 322 352 318 416 332 L416 414 C352 400 286 404 260 420 Z" fill="url(#bookGrad)"/>
    <!-- Center Spine Divider -->
    <path d="M256 336 L256 424" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
    <!-- Content Lines Left -->
    <path d="M128 354 Q180 346 226 352" stroke="#94a3b8" stroke-width="5" stroke-linecap="round" opacity="0.6"/>
    <path d="M128 374 Q180 366 226 372" stroke="#94a3b8" stroke-width="5" stroke-linecap="round" opacity="0.6"/>
    <path d="M128 394 Q180 386 210 390" stroke="#94a3b8" stroke-width="5" stroke-linecap="round" opacity="0.6"/>
    <!-- Content Lines Right -->
    <path d="M286 352 Q332 346 384 354" stroke="#94a3b8" stroke-width="5" stroke-linecap="round" opacity="0.6"/>
    <path d="M286 372 Q332 366 384 374" stroke="#94a3b8" stroke-width="5" stroke-linecap="round" opacity="0.6"/>
    <path d="M286 390 Q316 386 368 394" stroke="#94a3b8" stroke-width="5" stroke-linecap="round" opacity="0.6"/>
  </g>

  <!-- Laurel & Achievement Stars -->
  <path d="M256 62 L261 74 L274 75 L264 84 L267 97 L256 90 L245 97 L248 84 L238 75 L251 74 Z" fill="url(#goldGrad)"/>
</svg>
